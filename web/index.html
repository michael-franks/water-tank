<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Bach Water Tank</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/static/icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/static/icons/favicon-16.png" />
    <link rel="stylesheet" href="/static/style.css" />
    <!-- PWA: installable standalone app, offline shell, iOS home-screen support -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0ea5e9" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Bach Tank" />
    <link rel="apple-touch-icon" href="/static/icons/apple-touch-icon-180.png" />
    <script src="/static/vendor/chart.umd.min.js"></script>
    <script src="/static/vendor/chartjs-adapter-date-fns.bundle.min.js"></script>
  </head>
  <body>
    <div class="container">
      <div id="net-banner" class="net-banner" hidden></div>
      <nav class="tab-nav" role="tablist">
        <button class="tab-btn active" data-tab="dashboard" role="tab" aria-selected="true">Dashboard</button>
        <button class="tab-btn" data-tab="calendar" role="tab" aria-selected="false">Calendar</button>
      </nav>

      <div class="tab-content active" id="tab-dashboard" role="tabpanel">
      <section class="hero">
        <div class="hero-main">
          <div class="hero-left">
            <div class="hero-label">💧 Bach Water Tank Level</div>
            <div class="hero-value" id="hero-level">—</div>
            <div class="hero-sensor" id="hero-sensor" aria-live="polite"></div>
            <div class="hero-occupancy" id="hero-occupancy" aria-live="polite"></div>
            <div class="hero-booking" id="hero-booking" aria-live="polite"></div>
          </div>
          <div class="hero-right">
            <div class="hero-sub" id="hero-liters">—</div>
            <div class="hero-sub"><span class="badge" id="hero-days">—</span></div>
          </div>
        </div>
        <div class="hero-notif-strip">
          <label class="notif-slider">
            <input type="checkbox" id="toggle-water-alerts" />
            <span class="slider-track"></span>
            <span class="notif-slider-label">Water alerts</span>
          </label>
          <label class="notif-slider">
            <input type="checkbox" id="toggle-occupancy" />
            <span class="slider-track"></span>
            <span class="notif-slider-label">Occupancy alerts</span>
          </label>
          <span class="notif-status" id="notif-status" aria-live="polite"></span>
          <div id="push-control" class="push-control"></div>
        </div>
      </section>

      <section class="chart-section">
        <h2>History</h2>
        <div class="range-bar">
          <div class="range-pills" id="range-pills">
            <button type="button" data-range="day">Day</button>
            <button type="button" data-range="week">Week</button>
            <button type="button" data-range="month">Month</button>
            <button type="button" data-range="year">Year</button>
            <button type="button" data-range="all">All</button>
          </div>
          <div class="range-stepper" id="range-stepper">
            <button type="button" id="range-prev" class="range-step" aria-label="Previous period">‹</button>
            <span id="range-label" class="range-label">—</span>
            <button type="button" id="range-next" class="range-step" aria-label="Next period">›</button>
          </div>
        </div>
        <div class="chart-box"><canvas id="historyChart"></canvas></div>
        <p id="history-empty" class="chart-empty" style="display: none;">No readings in this period — the sensor may have been offline. Try a wider range or step back with ‹.</p>
      </section>

      <section class="chart-section">
        <h2>Feed-in Rate</h2>
        <p class="feedin-rate-subtitle">Average feed-in rate (measured from 2-7am)</p>
        <div class="chart-box"><canvas id="feedinChart"></canvas></div>
        <p id="feedin-legend" class="feedin-legend muted" style="display: none;">🔴= sensor error (condensation)</p>
      </section>

      <section class="footer-row">
        <div class="last-update footer-update">
          <div class="last-update-header">
            <span class="muted">Last update</span>
          </div>
          <div class="last-update-line" id="last-update">—</div>
          <div class="last-update-line" id="last-update-meta">—</div>
          <div class="last-update-line signal-pill-wrap">
            <span class="signal-details-inline" id="signal-details">—</span>
            <span class="badge" id="signal-badge">—</span>
          </div>
        </div>
        <div class="footer-details">
          <div class="meta" id="fw-version">Firmware: —</div>
        </div>
      </section>
      </div>

      <div class="tab-content" id="tab-calendar" role="tabpanel">
        <section class="hero">
          <div class="calendar-header">
            <button class="calendar-nav-btn" id="cal-prev" aria-label="Previous month">‹</button>
            <h2 class="calendar-month-label" id="cal-month-label">—</h2>
            <button class="calendar-nav-btn" id="cal-next" aria-label="Next month">›</button>
            <button class="calendar-nav-btn calendar-today-btn" id="cal-today">Today</button>
          </div>
          <div class="calendar-legend">
            <span class="cal-chip cal-chip-guest">Guests</span>
            <span class="cal-chip cal-chip-owner">Blocked</span>
            <span class="cal-chip cal-chip-closed">Closed</span>
          </div>
          <div class="calendar-grid" id="calendar-grid" aria-live="polite"></div>
        </section>
      </div>
    </div>

    <script src="/static/app.js"></script>
  </body>
</html>
